<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
    }
    h4 { margin: 0 0 10px 0; font-size: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 12px; }
    input[type="password"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 7px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #0077ff;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #005fd1; }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #008800;
      text-align: center;
      display: none;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #777;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h4>Photoprotocol</h4>

  <label for="modeSelect">Режим работы:</label>
  <select id="modeSelect">
    <option value="tiles">Мозаика (Тайлинг 32px)</option>
    <option value="noise">Попиксельный шум (XOR)</option>
    <option value="off">⏸️ Отключено (Не дешифровать)</option>
  </select>

  <label for="keyInput">Секретный ключ:</label>
  <input type="password" id="keyInput" placeholder="Введите пароль">

  <button id="saveBtn">Применить и обновить</button>
  <div id="status" class="status">Настройки применены!</div>

  <div class="hint">
    • <b>Мозаика</b> — для постов в ленте соцсетей.<br>
    • <b>Шум</b> — для документов/PNG без сжатия.<br>
    • <b>Отключено</b> — плагин спит и не тратит ресурсы.
  </div>

  <script src="popup.js"></script>
</body>
</html>
